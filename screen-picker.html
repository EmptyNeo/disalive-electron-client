<!doctype html>
<html lang="ru"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:">
  <link rel="stylesheet" href="screen-picker.css"><script defer src="screen-picker.js"></script>
</head><body>
  <div id="backdrop">
    <section class="picker" role="dialog" aria-modal="true" aria-label="Выберите источник демонстрации">
      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-type="window" role="tab" aria-selected="true">Приложения</button>
        <button type="button" class="tab" data-type="screen" role="tab" aria-selected="false">Весь экран</button>
        <button type="button" class="refresh" id="refresh" aria-label="Обновить список" data-tooltip="Обновить список"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg></button>
        <button type="button" class="close" id="cancel" aria-label="Закрыть"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <main id="sources" aria-label="Доступные источники"></main>
      <footer><span id="selected-name">Выберите окно или экран</span><button id="share" type="button" disabled>Демонстрировать</button></footer>
    </section>
  </div>
</body></html>
