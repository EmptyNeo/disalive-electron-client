<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="splash.css">
  <title>Disalive</title>
</head>
<body>
  <main>
    <div class="loading-logo-wrapper" aria-hidden="true">
      <div class="loading-main-circle"></div>
      <div class="loading-pulse-ring"><img src="assets/Logo.svg" alt=""></div>
    </div>
    <div id="status" role="status" aria-live="polite">Проверяем обновления...</div>
    <div class="loading-progress-container"><div id="progress" class="loading-progress-fill"></div></div>
    <div id="choices" class="choices" hidden>
      <button id="later" type="button">Позже</button>
      <button id="install" type="button">Установить</button>
    </div>
  </main>
  <script src="splash.js"></script>
</body>
</html>
